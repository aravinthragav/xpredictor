<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
    
    <!-- Primary Vector Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2652a"/>
      <stop offset="60%" stop-color="#e07d38"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Reality Cone Forward Projection -->
    <linearGradient id="coneGrad" x1="28" y1="32" x2="56" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c2652a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#273242" stroke-width="1.5"/>
  
  <!-- Subtle Internal Grid Matrix Accent -->
  <path d="M14 20 H50 M14 32 H50 M14 44 H50 M20 14 V50 M32 14 V50 M44 14 V50" stroke="#1c2533" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- Bayesian Reality Cone Variance Envelopes (Forward Fan) -->
  <path d="M30 32 L52 18 L52 46 Z" fill="url(#coneGrad)"/>
  <line x1="30" y1="32" x2="52" y2="18" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="2,2" opacity="0.85"/>
  <line x1="30" y1="32" x2="52" y2="46" stroke="#c2652a" stroke-width="1.4" stroke-dasharray="2,2" opacity="0.85"/>

  <!-- Iconic Dynamic 'X' Trajectory Blades -->
  <!-- Blade 1: Upward Momentum Trajectory -->
  <line x1="14" y1="48" x2="48" y2="16" stroke="url(#beamGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Blade 2: Counter-Cross Trajectory (with gap at nexus) -->
  <line x1="14" y1="16" x2="25" y2="27" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
  <line x1="35" y1="37" x2="48" y2="48" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.95"/>

  <!-- Anchor Node (t0 Live Bar Nexus) -->
  <circle cx="30" cy="32" r="3.2" fill="#ffffff" stroke="#c2652a" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="30" cy="32" r="1.2" fill="#f59e0b"/>
</svg>
