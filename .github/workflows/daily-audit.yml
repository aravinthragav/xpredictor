name: Daily Multi-Asset & Timeframe Audit

on:
  schedule:
    # 12:00 PM IST is 06:30 UTC
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Multi-Asset & Multi-Timeframe Health Audit
        run: node scripts/audit_all_assets_timeframes.js
