version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: xpredictor-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=0
      - QDRANT__SERVICE__MAX_REQUEST_SIZE_MB=32

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: xpredictor-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=xpredictor_marketdata
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - timescale_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: xpredictor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  kronos-embedder:
    build:
      context: ../../services/kronos-embedder
      dockerfile: Dockerfile
    container_name: xpredictor-kronos-embedder
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DEVICE=cpu
      - MODEL_NAME=NeoQuasar/Kronos-base

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    container_name: xpredictor-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - KRONOS_EMBEDDER_URL=http://kronos-embedder:8001
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/xpredictor_marketdata
    depends_on:
      - qdrant
      - redis
      - timescaledb
      - kronos-embedder

  ingestion-worker:
    build:
      context: ../../services/ingestion-worker
      dockerfile: Dockerfile
    container_name: xpredictor-ingestion-worker
    restart: unless-stopped
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - KRONOS_EMBEDDER_URL=http://kronos-embedder:8001
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/xpredictor_marketdata
    depends_on:
      - qdrant
      - timescaledb
      - kronos-embedder

volumes:
  qdrant_storage:
  timescale_data:
  redis_data:
